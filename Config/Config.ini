[General]
# Application environment
environment = Development

# Root directory for application data
app_root = .

# Database provider
database_engine = sqlite

[Paths]
# All paths are relative to app_root unless absolute
models_path = Models
checkpoints_path = Checkpoints
vocabulary_path = Vocabulary
training_data_path = TrainingData
logs_path = Logs
cache_path = Cache

[TransformerConfig]
# Name of the configuration preset to use when no explicit
# configuration is supplied.
default_model_config = Medium

[TrainingConfig]
# Name of the configuration preset to use when no explicit
# configuration is supplied.
default_training_config = AdamW_Default

[SQLite]
connection_string = data.sqlite

[Server]
host = localhost
port = 5000

[Frontend]
allowed_origin = http://localhost:5173

[Logging]
log_level = Information
log_file = Logs/simpletransformer.log

[Training]
# Whether training may automatically resume from the latest checkpoint
auto_resume = false

# Save temporary checkpoints during training
save_temporary_checkpoints = true

# Number of epochs between persistent checkpoints
checkpoint_interval = 5

[Inference]
# Whether inference requests are permitted while training is running
allow_during_training = false